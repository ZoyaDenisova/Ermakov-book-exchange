logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bookswap
    username: postgres
    password: 3434
    driver-class-name: org.postgresql.Driver
  mvc:
    static-path-pattern: /uploads/**
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/migration/db.changelog-master.yaml

server:
  port: 8080

debug: true
